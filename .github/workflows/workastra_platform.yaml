---
name: Workastra Platform

on:
  pull_request:
  push:
    branches:
      - v0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  JAVA_VERSION: 25.0.1
  JAVA_DISTRIBUTION: graalvm

jobs:
  qodana:
    name: Qodana Scan
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      checks: write
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: JetBrains/qodana-action@v2025.3.2
        with:
          pr-mode: false
      - if: always()
        uses: github/codeql-action/upload-sarif@v4.35.2
        with:
          sarif_file: ${{ runner.temp }}/qodana/results/qodana.sarif.json

  jvm-build:
    name: "[${{ matrix.module }}] JVM build & test"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        module: [console, iam, migration]
    steps:
      - uses: actions/checkout@v6

      - name: Set up GraalVM
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Build JVM
        run: ./gradlew --no-daemon :${{ matrix.module }}:build

  native-test:
    name: "[${{ matrix.module }}] Native tests"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [console, iam, migration]
    steps:
      - uses: actions/checkout@v6

      - name: Set up GraalVM
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Run native tests
        run: ./gradlew --no-daemon :${{ matrix.module }}:nativeTest

  native-build:
    name: "[${{ matrix.module }}] Native image build"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        module: [console, iam, migration]
    steps:
      - uses: actions/checkout@v6

      - name: Set up GraalVM
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: gradle

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.module }}

      - name: Build native image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./${{ matrix.module }}/Dockerfile
          push: false
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
